global:
  resolve_timeout: 5m

route:
  receiver: fastapi
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: fastapi
    webhook_configs:
      - url: "http://127.0.0.1:8000/alert"
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, cluster, service]
